name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Optional tag to publish a GitHub Release (e.g. v1.0.0); leave blank to upload workflow artifact only"
        required: false
        default: ""
        type: string

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up MinGW-w64 (MSYS2)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-gcc

      - name: Build c-reef.exe
        shell: msys2 {0}
        run: gcc -std=c99 -O2 -Wall -Wextra -Wpedantic -Werror -static aquarium.c -o c-reef.exe -lm

      - name: Smoke test c-reef.exe
        shell: pwsh
        run: |
          .\c-reef.exe --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Generate SHA256SUMS.txt
        shell: pwsh
        run: |
          $hash = (Get-FileHash -Path "c-reef.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  c-reef.exe" | Set-Content -Path "SHA256SUMS.txt" -Encoding ascii
          Get-Content "SHA256SUMS.txt"

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: c-reef-windows-x64
          path: |
            c-reef.exe
            SHA256SUMS.txt

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          generate_release_notes: true
          files: |
            c-reef.exe
            SHA256SUMS.txt
