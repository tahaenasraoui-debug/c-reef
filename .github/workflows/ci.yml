name: CI

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@v4

      - name: Build (-Werror)
        run: make CC=${{ matrix.cc }} CFLAGS="-std=c99 -O2 -Wall -Wextra -Wpedantic -Werror"

      - name: Run test suite
        run: make test

      - name: Sanitizer build & test suite (ASan/UBSan + -Werror)
        run: make test-asan CC=${{ matrix.cc }}

      - name: Sanitizer PTY timeout test (SIGTERM must exit cleanly)
        run: script -qec "stty cols 100 rows 30 && timeout --preserve-status 3 ./c-reef-asan --sound" /dev/null
